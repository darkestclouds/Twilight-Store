manifestVersion: 1
id: twilight-torrserver
category: networking
name: TorrServer
version: "MatriX.137"
tagline: Torrent stream server для просмотра торрентов онлайн
description: >-
  TorrServer - это мощный сервер для потоковой передачи торрентов, который позволяет смотреть фильмы и видео напрямую из торрент-файлов без предварительной загрузки. Просто добавьте торрент или магнет-ссылку, и начинайте просмотр!


  🎬 Основные возможности:

  • Потоковое воспроизведение видео из торрентов без полной загрузки

  • Веб-интерфейс для управления торрентами

  • Поддержка magnet-ссылок и torrent-файлов

  • Встроенный DLNA сервер для Smart TV

  • API для интеграции с внешними плеерами

  • Поддержка HTTP/HTTPS

  • Минимальное использование ресурсов


  TorrServer идеально подходит для домашнего медиа-сервера и позволяет смотреть контент на любом устройстве через браузер или совместимые плееры.


  ⚠️ TorrServer загружает торренты через обычный интернет, не через Tor.
developer: YouROK
website: https://yourok.ru
dependencies: []
repo: https://github.com/YouROK/TorrServer
support: https://github.com/YouROK/TorrServer/issues
port: 8090
gallery:
  - https://raw.githubusercontent.com/MrKsey/torrserver/master/ts.jpg
releaseNotes: >-
  Добавление:

  •  Поиска
  •  Infuse в веб
  •  Французского языка в веб
  •  Torrfs (fusefs, webdav)
  •  Обновление dlna
  •  Конфигурация хранилища
  •  DNS с фоллбеком
  •  Багфиксы в прелоаде, работе с БД и кешем

  Спасибо @tsynik, @pavelpikta, @Dimariqe, @LomikXP, @AlienBEA, @ddonindia, @Drafteed
path: ""
