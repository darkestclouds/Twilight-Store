manifestVersion: 1
id: twilight-hdrezka
category: media
name: HDRezka for Lampa
version: "0.1.0"
tagline: Онлайн-источник HDRezka для Lampa и приложения Apple TV
description: >-
  Сервер онлайн-источника HDRezka: плагин для Lampa и источник в формате lampac для нативного приложения Apple TV.
  Всю работу с сайтом делает сервер — зеркала, анти-бот, вход в аккаунт, поиск, переводы, сезоны и серии.
  Видео ТВ берёт напрямую с CDN, через сервер идут только короткие запросы.


  🎬 Основные возможности:

  • Плагин Lampa: кнопка в карточке, выбор перевода и сезона, список серий с кадрами и описаниями из TMDB

  • Источник для приложения Apple TV: переводы, сезоны, серии и ссылки на видео

  • Поиск по названию и году, варианты с постерами, если совпадение неуверенное

  • Вход в аккаунт HDRezka — сохраняются только куки сессии, пароль не хранится

  • Веб-интерфейс настройки: зеркало, статус, ссылки для ТВ, аккаунт


  ⚙️ После установки откройте приложение и впишите адрес зеркала HDRezka — встроенных адресов в сервере нет.
  Затем скопируйте ссылку на плагин для Lampa или адрес подключения для приложения Apple TV.


  🔒 Страница настройки закрыта входом в Umbrel. Без входа доступны только пути для ТВ: файл плагина,
  API плагина (закрыт токеном) и источник для Apple TV.
